name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type Check, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: predent_test
          POSTGRES_USER: predent
          POSTGRES_PASSWORD: predent_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predent -d predent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pinned ManipAT runtime
        run: node tools/prepare-manipat-runtime.mjs --build-only

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Verify dependency licenses
        run: npm run licenses:check

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-sbom
          path: sbom.cdx.json

      - name: Link pinned ManipAT runtime
        run: node tools/prepare-manipat-runtime.mjs --link-only

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Verify migrations are up-to-date
        run: |
          npm run db:generate
          git diff --exit-code db/migrations/ || (echo "Migration files are out of date. Run 'npm run db:generate' and commit the results." && exit 1)

      - name: Apply migrations to disposable test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://predent:predent_test_password@localhost:5432/predent_test

      - name: Run server tests with coverage thresholds
        run: npm run test:server -- --coverage
        env:
          TEST_DATABASE_URL: postgresql://predent:predent_test_password@localhost:5432/predent_test

      - name: Verify indexed query plans
        run: npm run db:verify-plans
        env:
          TEST_DATABASE_URL: postgresql://predent:predent_test_password@localhost:5432/predent_test

      - name: Verify database connection capacity
        run: npm run db:capacity
        env:
          TEST_DATABASE_URL: postgresql://predent:predent_test_password@localhost:5432/predent_test
          DATABASE_POOL_MAX: 8

      - name: Run frontend tests with coverage thresholds
        run: npm run test:frontend -- --coverage

      - name: Enforce production bundle budgets
        run: npm run build

      - name: Install Playwright Chrome
        run: npx playwright install --with-deps chrome

      - name: Run Playwright accessibility and smoke release gates
        run: npx playwright test e2e/accessibility.spec.ts e2e/accessibility-auth.spec.ts e2e/smoke.spec.ts e2e/load.spec.ts
        env:
          DATABASE_URL: postgresql://predent:predent_test_password@localhost:5432/predent_test
          APP_SECRET: ci-only-session-secret-at-least-32-characters

      - name: Run authenticated compiled-production PAT corpus gate
        run: npx playwright test e2e/pat-authenticated-smoke.spec.ts --workers=1
        env:
          DATABASE_URL: postgresql://predent:predent_test_password@localhost:5432/predent_test
          APP_SECRET: ci-only-session-secret-at-least-32-characters
          PUBLIC_APP_URL: https://localhost:3000
          PAT_E2E_PRODUCTION: "1"

      - name: Upload PAT visual corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pat-visual-corpus
          path: test-results/
          if-no-files-found: ignore

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: false
          load: true
          tags: predent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: predent:latest
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate and upload image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: predent:latest
          format: cyclonedx-json
          artifact-name: image-sbom.cdx.json